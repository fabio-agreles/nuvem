[package]
name = "nuvem"
version = "1.2.1"
description = "Sincronização visual de Google Drive e OneDrive"
authors = ["Nuvem contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "nuvem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
# Sem esta feature o binário abre a devUrl (localhost:1420) em vez dos arquivos
# embutidos em `dist/`. O `tauri build` já a ativa; builds diretos com `cargo build
# --release` (Flatpak, CI) precisam passá-la explicitamente.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# `image-png` habilita `Image::from_bytes`: os ícones simbólicos da bandeja
# viajam embutidos no binário (nada para procurar em disco no Flatpak).
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.8"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Sorteio da senha do painel RC do rclone a cada execução (ver `rclone::credenciais`).
getrandom = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "fs"] }
notify = "8"

# D-Bus: o portal `org.freedesktop.portal.Background` do Flatpak (iniciar junto
# com o sistema). Só existe no Unix — no Windows quem cuida disso é o plugin do
# Tauri, que grava a chave `Run` do registro.
[target.'cfg(unix)'.dependencies]
zbus = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
